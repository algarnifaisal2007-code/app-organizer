name: Build FAP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ufbt-build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release channel
            sdk-channel: release
          - name: dev channel
            sdk-channel: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ufbt
        id: build-app
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.4
        with:
          sdk-channel: ${{ matrix.sdk-channel }}

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.sdk-channel }}-${{ steps.build-app.outputs.suffix }}
          path: ${{ steps.build-app.outputs.fap-artifacts }}

      - name: Lint sources
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.4
        with:
          # ufbt and the SDK are already set up by the build step
          skip-setup: true
          task: lint
